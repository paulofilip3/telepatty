[project]
name = "telepatty"
version = "0.1.0"
description = "Watch and interact with tmux from your iPad"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0",
]

[project.scripts]
telepatty = "server.main:run"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
