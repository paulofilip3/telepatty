<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e1e2e">
    <title>telepatty</title>
    <script>
        (function() {
            var t = localStorage.getItem('tp-theme') ||
                    (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', t);
            document.querySelector('meta[name="theme-color"]').content =
                t === 'light' ? '#eff1f5' : '#1e1e2e';
        })();
    </script>
    <link rel="stylesheet" href="/static/style.css?v=14">
</head>
<body>
    <!-- Auth screen -->
    <div id="auth" class="auth-screen">
        <div class="auth-box">
            <h1 class="auth-title">telepatty</h1>
            <p class="auth-sub">tmux remote controller</p>
            <input type="password" id="auth-token" class="auth-input" placeholder="token" autocomplete="off" autofocus>
            <button id="auth-btn" class="btn btn-primary auth-btn">connect</button>
        </div>
    </div>

    <!-- Main app -->
    <div id="app" class="app hidden">
        <header class="header">
            <button id="sidebar-toggle" class="btn btn-icon" aria-label="Toggle sidebar">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <span class="header-title" id="header-title">telepatty</span>
            <div class="header-actions">
                <button id="zoom-btn" class="btn btn-icon hidden" aria-label="Toggle zoom" title="Zoom pane">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M2 6h14M6 6v10" stroke="currentColor" stroke-width="1" opacity="0.4"/></svg>
                </button>
                <button id="fit-btn" class="btn btn-icon hidden" aria-label="Fit to client" title="Fit tmux to this screen">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 6V3a1 1 0 011-1h3M12 2h3a1 1 0 011 1v3M16 12v3a1 1 0 01-1 1h-3M6 16H3a1 1 0 01-1-1v-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
                <button id="theme-btn" class="btn btn-icon" aria-label="Toggle theme">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M9 1v2M9 15v2M1 9h2M15 9h2M3.3 3.3l1.4 1.4M13.3 13.3l1.4 1.4M3.3 14.7l1.4-1.4M13.3 4.7l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
            </div>
        </header>

        <div class="app-body">
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <span>sessions</span>
                    <button id="new-session-btn" class="btn btn-icon btn-sm" title="New session">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <div id="tree" class="tree"></div>
            </aside>

            <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

            <main class="terminal-area">
                <div id="terminal" class="terminal">
                    <div class="terminal-placeholder">
                        <p>select a pane from the sidebar</p>
                    </div>
                </div>
                <!-- Terminal keyboard toolbar -->
                <div id="term-keys" class="term-keys">
                    <div class="term-keys-row">
                        <button class="tk" data-special="Escape">Esc</button>
                        <button class="tk" data-special="Tab">Tab</button>
                        <button class="tk tk-mod" id="tk-ctrl">Ctrl</button>
                        <button class="tk tk-mod" id="tk-alt">Alt</button>
                        <span class="tk-sep"></span>
                        <button class="tk" data-special="Up">&#9650;</button>
                        <button class="tk" data-special="Down">&#9660;</button>
                        <button class="tk" data-special="Left">&#9664;</button>
                        <button class="tk" data-special="Right">&#9654;</button>
                        <span class="tk-sep"></span>
                        <button class="tk" data-literal="|">|</button>
                        <button class="tk" data-literal="~">~</button>
                        <button class="tk" data-literal="\">\</button>
                        <button class="tk" data-literal="/">/</button>
                        <button class="tk" data-literal="-">-</button>
                        <button class="tk" data-literal="_">_</button>
                        <button class="tk" data-literal="*">*</button>
                        <button class="tk" data-literal="$">$</button>
                        <button class="tk" data-literal="{">{</button>
                        <button class="tk" data-literal="}">}</button>
                        <button class="tk" data-literal="[">[</button>
                        <button class="tk" data-literal="]">]</button>
                        <button class="tk" data-literal="`">`</button>
                        <button class="tk" data-literal="'">'</button>
                        <span class="tk-sep"></span>
                        <button class="tk tk-shortcut" data-special="C-c">^C</button>
                        <button class="tk tk-shortcut" data-special="C-d">^D</button>
                        <button class="tk tk-shortcut" data-special="C-z">^Z</button>
                        <button class="tk tk-shortcut" data-special="C-l">^L</button>
                        <button class="tk tk-shortcut" data-special="C-a">^A</button>
                        <button class="tk tk-shortcut" data-special="C-e">^E</button>
                        <button class="tk tk-shortcut" data-special="C-r">^R</button>
                        <button class="tk tk-shortcut" data-special="C-w">^W</button>
                    </div>
                </div>
                <div class="input-bar">
                    <button id="mic-btn" class="btn btn-icon btn-mic" aria-label="Voice input" title="Hold to speak">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="7" y="2" width="6" height="10" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M4 9a6 6 0 0012 0M10 17v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    </button>
                    <textarea id="input-text" class="input-text" placeholder="type or speak..." rows="1" autocomplete="off"></textarea>
                    <button id="send-btn" class="btn btn-icon btn-send" aria-label="Send" title="Send (Enter)">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 10h12M12 6l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
            </main>
        </div>

        <!-- Pane action sheet -->
        <div id="pane-actions" class="action-sheet hidden">
            <div class="action-sheet-backdrop"></div>
            <div class="action-sheet-body">
                <div class="action-sheet-title" id="pane-actions-title">Pane</div>
                <button class="action-sheet-btn" data-action="split-v">Split vertically</button>
                <button class="action-sheet-btn" data-action="split-h">Split horizontally</button>
                <button class="action-sheet-btn" data-action="zoom">Toggle zoom</button>
                <button class="action-sheet-btn action-sheet-danger" data-action="kill-pane">Kill pane</button>
                <button class="action-sheet-btn" data-action="cancel">Cancel</button>
            </div>
        </div>

        <!-- Window action sheet -->
        <div id="window-actions" class="action-sheet hidden">
            <div class="action-sheet-backdrop"></div>
            <div class="action-sheet-body">
                <div class="action-sheet-title" id="window-actions-title">Window</div>
                <button class="action-sheet-btn" data-action="new-window">New window</button>
                <button class="action-sheet-btn action-sheet-danger" data-action="kill-window">Kill window</button>
                <button class="action-sheet-btn action-sheet-danger" data-action="kill-session">Kill session</button>
                <button class="action-sheet-btn" data-action="cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js?v=14"></script>
</body>
</html>
